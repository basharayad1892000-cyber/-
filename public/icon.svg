<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle for standard icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer subtle Islamic decorative border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 8" />

  <!-- Central Emblem Group -->
  <g transform="translate(256, 230)">
    <!-- Crescent Moon -->
    <path d="M 30,-110 C 105,-110 160,-50 160,30 C 160,110 95,170 15,170 C -35,170 -85,145 -115,100 C -70,115 -10,95 20,40 C 45,-5 35,-65 5,-105 C 13,-108 21,-110 30,-110 Z" fill="url(#gold-grad)" filter="url(#glow)" />

    <!-- 8-Pointed Islamic Star -->
    <g transform="translate(-40, -40) scale(1.15)">
      <!-- Star Square 1 -->
      <rect x="-30" y="-30" width="60" height="60" rx="4" fill="url(#gold-grad)" />
      <!-- Star Square 2 rotated 45 deg -->
      <rect x="-30" y="-30" width="60" height="60" rx="4" fill="url(#gold-grad)" transform="rotate(45)" />
      <!-- Inner core circle -->
      <circle r="12" fill="#064e3b" />
      <circle r="6" fill="#fef08a" />
    </g>

    <!-- Tasbeeh Beads Arch -->
    <g fill="#fef08a" opacity="0.9">
      <circle cx="-135" cy="55" r="9" />
      <circle cx="-145" cy="85" r="9" />
      <circle cx="-145" cy="115" r="9" />
      <circle cx="-135" cy="145" r="9" />
      <circle cx="-115" cy="170" r="9" />
      <circle cx="-85" cy="190" r="9" />
      <circle cx="-55" cy="200" r="9" />
      <circle cx="-25" cy="202" r="9" />
      <circle cx="5" cy="198" r="9" />
      <circle cx="35" cy="186" r="9" />
    </g>
  </g>

  <!-- Elegant Arabic Calligraphy / Text "أذكاري" at Bottom -->
  <text x="256" y="445" font-family="'Amiri', serif, system-ui" font-size="52" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">
    أَذْكَارِي
  </text>
</svg>
